services:
  app:
    build:
      context: .
    init: true
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - reliability-runs:/app/runs

volumes:
  reliability-runs:
